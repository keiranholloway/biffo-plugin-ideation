name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  python:
    name: Python (lint, types, test)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # A self-hosted spot runner reclaimed mid-job leaves the job HANGING rather
    # than failing, and with no timeout it burns the 360-minute default before
    # anyone is told. On 2026-07-30 five jobs across two PRs died this way with
    # "The runner has received a shutdown signal". 20m is several times the
    # slowest job observed anywhere in this estate (Playwright E2E, 3.7m).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright src tests
      # `--cov-report=json` is not a second copy for reporting's sake --
      # `scripts/error_branch_coverage.py` (below) reads `coverage.json` and
      # nothing else. Without this flag the gate step has no input and exits 2
      # ("no coverage data"), which is the gate failing to run rather than the
      # gate passing -- same pairing biffo-plugin-marketing's ci.yml uses.
      - name: Test
        run: uv run pytest -q --cov --cov-report=json
      # Fails only when error handling is ADDED with nothing exercising it
      # (biffo-template#956). An unexecuted `except` is unverified -- nobody has
      # ever observed what it does -- and that is where this estate's fail-opens
      # have actually lived. A ratchet, not a hard gate: pre-existing unexecuted
      # branches are recorded in the committed baseline
      # (docs/practices/error-branch-baseline.json) and do not block; only a
      # NEW one does.
      #
      # `scripts/error_branch_coverage.py` is byte-identical to
      # `biffo-template/scripts/error_branch_coverage.py` (shared-sync
      # distributed). Do not edit it here -- edit it upstream.
      - name: Error-branch coverage
        run: uv run python scripts/error_branch_coverage.py --check --coverage coverage.json

  # This repo had no secret scanning at all -- no CI job, no .gitleaks.toml,
  # while .githooks/pre-push's own claim guard comment named gitleaks as part
  # of "the WHOLE gate" (#143). Ported from biffo-plugin-idea-scout's
  # "Secret Scan" job (ci.yml:122-167), the closer sibling: it carries no
  # per-repo `commits = [...]` allowlist, unlike biffo-plugin-marketing's
  # (which exists only to exempt already-merged fixture commits from a rule
  # this repo does not need). `.gitleaks.toml` here matches
  # biffo-plugin-marketing's current (post-#188) minimal stub -- title plus
  # `useDefault = true`, no repo-specific rules -- rather than
  # biffo-plugin-idea-scout's (it has none) or biffo-template's (its
  # `biffo-placeholder-config` rule targets `biffo.config.json`, a
  # core-project file this plugin repo does not have).
  #
  # gitleaks/gitleaks-action@v2 (what the plugin skeleton ships) does not work
  # here, for two independent reasons both idea-scout's and marketing's ci.yml
  # already document:
  #   1. On the self-hosted runner fleet the action's SARIF upload dies with
  #      "The rootDirectory: /home/ec2-user is not a parent directory of the
  #      file: .../results.sarif" -- the scan itself passes and the job still
  #      fails.
  #   2. It requires a paid GITLEAKS_LICENSE for organization-owned repos.
  #      This repo is personal today, but the moment it moves under an org
  #      the check breaks silently.
  # Install the free, open-source gitleaks CLI directly instead -- same
  # detection, no artifact upload, no license. Pinned to v8.30.1 (matching
  # both sibling repos) with a sha256sum check against the release's own
  # published checksum.
  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # First pass: scan git history (fetch-depth: 0 above), catching secrets
      # committed then removed within the same history.
      #
      # --log-opts is load-bearing: gitleaks' default git log arguments
      # include `--all`, so with fetch-depth: 0 the scan covers commits that
      # live only on *unmerged* branches -- one bad commit on anyone's open
      # branch then reddens dev and every open PR at once, with nothing in
      # the built ref responsible for it. Scoping to HEAD restricts the scan
      # to commits reachable from the ref under test without weakening
      # detection.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="--full-history HEAD"
      # Second pass: scan every file in the working tree (no-git mode), so
      # secrets sitting in files no commit under test touched are caught too.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  # This repo has held scripts/py-dependency-audit.sh and
  # scripts/js-dependency-audit.sh without invoking either — shared-sync
  # delivers the SCRIPT into a repo, it cannot wire it into CI
  # (biffo-template AGENTS.md §9). So neither this repo's Python dependencies
  # (root pyproject.toml/uv.lock) nor its two JS trees (web/, web-admin/) had
  # ever been scanned by this repo's own CI — a js-yaml/nanoid advisory pair
  # in web/ and web-admin/'s lockfiles was found only from DOWNSTREAM, by
  # biffo-platform's audit walking a vendored copy (fixed here in #138).
  #
  # One job, matching biffo-plugin-idea-scout's "Dependency Audit" job/check
  # name so the two repos' PR check lists converge rather than diverge
  # further. Both scripts discover every lockfile/lockfile-equivalent tree by
  # walking from the git root (#1270), so a single invocation of each from the
  # repo root covers web/ and web-admin/ (JS) and the root uv.lock (Python)
  # with no per-tree invocation needed — verified locally before this job was
  # added.
  #
  # Neither step gets `continue-on-error` or `|| true`. Both scripts already
  # distinguish "found a real advisory" (exit 1) from "could not determine"
  # (exit 2, e.g. an unparseable registry response or a missing tool) — see
  # each script's own header — and an audit that cannot run must BLOCK, not
  # pass. `pip-audit` is declared in this repo's `[dependency-groups].dev`
  # already, so `uv sync --all-groups` is sufficient for the Python side; the
  # JS side needs only the `pnpm` binary (no `pnpm install`/lockfile install
  # required — `pnpm audit` reads the committed lockfile directly, confirmed
  # locally with node_modules absent).
  security-deps:
    name: Dependency Audit
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --all-groups
      - name: Python dependency audit
        run: sh scripts/py-dependency-audit.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      # No `cache: pnpm` here, unlike the frontend/admin-frontend jobs below.
      # Those jobs run `pnpm install`, which populates a store worth caching.
      # This job never does — `pnpm audit` reads the committed lockfile and
      # queries the registry directly, so no store is ever populated, and
      # asking actions/setup-node to save an empty one fails the job at the
      # post-step with "Path Validation Error: Path(s) specified in the
      # action for caching do(es) not exist" (hit by biffo-plugin-idea-scout's
      # equivalent job before this one was written).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS dependency audit
        run: sh scripts/js-dependency-audit.sh

  frontend:
    name: Frontend (lint, types, test, build)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # web-admin/ had no CI at all: its tests, types and build were never run by
  # anything, so a broken admin panel reached dev.biffo.io with the PR green.
  # It is a separate pnpm project with its own lockfile (not a workspace member
  # of web/), so it needs its own job rather than another step above.
  admin-frontend:
    name: Admin frontend (lint, types, test, build)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
