name: Release

# Runs on every push of a `v*` tag: re-runs the full CI gate, checks that every
# version this repo declares agrees with the tag, builds the sdist/wheel, and
# cuts a GitHub Release.
#
# ## Three versions have to agree
#
# This plugin declares its version in two places, and the tag is a third:
#
#   - `pyproject.toml`      -> the Python package
#   - `biffo.plugin.json`   -> what the plugin registry publishes, and therefore
#                              the version the portal's plugin store shows
#   - the `v*` tag itself
#
# The manifest one is easy to forget and fails silently in the worst way: the
# registry would keep advertising the old version in the marketplace while a
# new one is tagged and released. So both are checked against the tag here, and
# a mismatch fails the release rather than shipping a lie to the store.
#
# ## Registry publishing is NOT done here
#
# `publish-registry.yml` owns that, triggered by a change to
# `biffo.plugin.json` on `dev` — i.e. when the version is *merged*, not when it
# is tagged. Deliberately separate: the marketplace should reflect what is on
# `dev`, and tagging is an independent decision. (A weekly pull-based sync in
# the registry repo also re-derives every entry from this manifest, so the store
# converges even with no token configured. See biffo-plugins-registry#4.)
#
# ## PyPI publishing is opt-in
#
# No plugin in this ecosystem has a real PyPI project or publishing credential
# yet. Rather than ship a workflow whose last step always fails — which trains
# everyone to ignore a red release — the publish step is gated on the
# `PYPI_PUBLISH` repository variable and skips with a notice until you set it.
#
# To enable: create the PyPI project, configure a trusted publisher (OIDC — no
# stored secret to rotate or leak; the `id-token: write` permission below is
# already in place for it), then `gh variable set PYPI_PUBLISH --body true`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for PyPI trusted publishing

env:
  PYTHON_VERSION: '3.13'

jobs:
  release:
    name: Verify, Build & Release
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --all-groups

      # Full CI gate re-run on the tag, not just a build — a tag push must be
      # at least as strict as a merged PR before anything is published.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src tests
      - run: uv run pytest -q

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml and biffo.plugin.json match the tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          project_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          manifest_version="$(python3 -c "import json; print(json.load(open('biffo.plugin.json'))['version'])")"
          failed=0
          if [ "$project_version" != "$TAG_VERSION" ]; then
            echo "::error file=pyproject.toml::pyproject.toml version ($project_version) does not match tag $GITHUB_REF_NAME"
            failed=1
          fi
          if [ "$manifest_version" != "$TAG_VERSION" ]; then
            echo "::error file=biffo.plugin.json::biffo.plugin.json version ($manifest_version) does not match tag $GITHUB_REF_NAME. The plugin registry publishes this field, so releasing with it stale would leave the portal's plugin store advertising $manifest_version."
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "pyproject.toml, biffo.plugin.json and the tag all agree on $TAG_VERSION"

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Note that PyPI publishing is not enabled
        if: vars.PYPI_PUBLISH != 'true'
        run: |
          echo "::notice title=PyPI publish skipped::The PYPI_PUBLISH repository variable is not set to 'true', so the built distribution was not uploaded. The GitHub Release below still carries it. See this workflow's header comment to enable."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
