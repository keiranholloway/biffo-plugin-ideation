[project]
name = "biffo-plugin-ideation"
version = "0.1.0"
description = "Ideation Engine — an agentic module that pressure-tests a founder's idea and produces a PRD + viability scorecard. A user-facing Biffo module (ADR-0003 plugin + ADR-0016 sync run/thread spine)."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10.4",
  # The founder-gated Lambda (ADR-0018): the SDK's require_group gate (user-serving)
  # + SigV4 signing for the Core seams (sigv4 -> botocore). biffo-plugin-sdk 1.1.0
  # is on PyPI, so this resolves normally.
  "biffo-plugin-sdk[user-serving,sigv4]>=1.1,<2.0",
  "fastapi>=0.115.0",
  "mangum>=0.19.0",
  "httpx>=0.28.1",
  "aws-lambda-powertools>=3.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.8.0", "pyright>=1.1.0", "jsonschema>=4.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideation"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Match the platform's Ruff standard (Biffo core pyproject) so this plugin lints
# clean when vendored into an instance — the instance enforces this select over
# services/<plugin>/ with no third-party carve-out. Keep in step with core.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
