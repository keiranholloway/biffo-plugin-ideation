[project]
name = "biffo-plugin-ideation"
version = "0.1.0"
description = "Ideation Engine — an agentic module that pressure-tests a founder's idea and produces a PRD + viability scorecard. A user-facing Biffo module (ADR-0003 plugin + ADR-0016 sync run/thread spine)."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10.4",
  # The founder-gated Lambda (ADR-0018): the SDK's require_group gate (user-serving)
  # + SigV4 signing for the Core seams (sigv4 -> botocore). biffo-plugin-sdk 1.1.0
  # is on PyPI, so this resolves normally.
  "biffo-plugin-sdk[user-serving,sigv4]>=1.1,<2.0",
  "fastapi>=0.115.0",
  "mangum>=0.19.0",
  "httpx>=0.28.1",
  "aws-lambda-powertools>=3.4.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.8.0", "pyright>=1.1.0", "jsonschema>=4.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
