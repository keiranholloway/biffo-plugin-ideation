[project]
name = "biffo-plugin-ideation"
version = "0.1.0"
description = "Ideation Engine — an agentic module that pressure-tests a founder's idea and produces a PRD + viability scorecard. A user-facing Biffo module (ADR-0003 plugin + ADR-0016 sync run/thread spine)."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10.4",
  # The founder-gated ASGI app (ADR-0021), mounted by the shared plugin host: the
  # SDK's require_group gate (user-serving) + SigV4 signing for the Core seams
  # (sigv4 -> botocore). No mangum — the host provides the Lambda entrypoint.
  # >=1.3 for PrincipalCoreClient (biffo-template#1490): the forwarded-user
  # token is folded into signing at its single _sign() choke point.
  "biffo-plugin-sdk[user-serving,sigv4]>=1.3,<2.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "aws-lambda-powertools>=3.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
  "jsonschema>=4.23.0",
  "pip-audit>=2.7.3",
]

[tool.uv]
# `cryptography` arrives transitively — `biffo-plugin-sdk[user-serving]` pulls
# `pyjwt[crypto]`, which pulls `cryptography`. Nothing here declares it, so
# there is no floor to raise and the constraint has to be stated.
#
# CVE-2026-69247 / GHSA-g6cj-pr64-35w5 (2026-08-03): `pkcs7_decrypt_*` reported
# the outcome of unwrapping a RecipientInfo's `encryptedKey` in four
# distinguishable ways — one of them disclosing the recovered key length — and
# the same distinction was observable by timing. That is a Bleichenbacher oracle
# against the content-encryption key for anything that decrypts
# attacker-supplied EnvelopedData and answers adaptively. Introduced in 44.0.0,
# fixed in 50.0.0 (RFC 3218: the content-encryption algorithm is resolved before
# the private key is used, so every failure path does identical work).
#
# This plugin does not call the PKCS#7 APIs, so the constraint is preventative
# rather than a live exposure — but `pip-audit` reads the resolved tree, not the
# reachable code. Do not remove it as unnecessary: without it the lockfile
# resolves 49.0.0 and `scripts/py-dependency-audit.sh` reports a vulnerability.
constraint-dependencies = ["cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideation"]

# Explicit rather than whatever coverage.py's default happens to be, and
# mirrors biffo-plugin-marketing's shape (biffo-template#1603) rather than
# inventing a narrower one. When this plugin is vendored into an instance, the
# instance's own `[tool.coverage.run]` measures "everything except tests/" —
# `source` here has to agree, or a module under `scripts/` can add unverified
# error handling, pass clean here, and only red-light the instance once
# vendored (the exact failure biffo-plugin-marketing#180 hit before its scope
# was widened to include `scripts`).
[tool.coverage.run]
source = ["src", "scripts"]
omit = ["*/tests/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

# Match the platform's Ruff standard (Biffo core pyproject) so this plugin lints
# clean when vendored into an instance — the instance enforces this select over
# services/<plugin>/ with no third-party carve-out. Keep in step with core.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
